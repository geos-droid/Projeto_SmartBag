<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Bag | Painel do parceiro</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parceiro.css">
</head>
<body>
<header class="topo">
 <a class="logo" href="dashboard.html"><img src="/img/logo-l.png" alt="Smart Bag"></a>
 <h1>Painel do parceiro</h1>
 <button id="temaBtn" class="tema" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
 <a class="link" href="conta.html" id="contaLink">Minha conta</a>
</header>

<main>
 <section class="identidade-loja">
  <div class="identidade-principal"><div class="avatar-loja"><img id="perfilLogo" src="/img/logo-l.png" alt="Logo do mercado"></div><div><span class="eyebrow">Loja ativa</span><h2 id="perfilMercado">Seu mercado</h2><p id="perfilUnidade">UN-000 · gerado automaticamente</p></div></div>
  <form id="formMercado" class="form-mercado">
   <div class="campo"><label for="mercadoNome">Nome do mercado</label><input id="mercadoNome" required></div>
   <div class="campo"><label for="mercadoLocal">Localização</label><input id="mercadoLocal" required placeholder="Bairro / cidade"></div>
   <div class="campo"><label for="mercadoLogo">Logo (URL opcional)</label><input id="mercadoLogo" type="url" placeholder="https://..."></div>
   <div class="identidade-actions"><span>ID da unidade é automático</span><button class="btn" type="submit">Salvar dados da loja</button></div>
   <p class="msg" id="msgMercado"></p>
  </form>
 </section>

 <section class="resumo" id="resumo"></section>

 <section class="painel">
  <h2 id="tituloForm">Cadastrar produto</h2>
  <form id="formProduto">
   <input type="hidden" id="id">
   <div class="campo"><label for="nome">Nome do produto</label><input id="nome" required minlength="3" placeholder="Ex.: Pão de forma"></div>
   <div class="campo"><label for="categoria">Categoria</label>
    <input id="categoria" list="categorias" required placeholder="Ex.: padaria">
    <datalist id="categorias"><option value="padaria"><option value="mercearia"><option value="frios"><option value="acougue"><option value="bebidas"></datalist>
   </div>
   <div class="linha">
    <div class="campo"><label for="preco">Preço (R$)</label><input id="preco" type="number" step="0.01" min="0.01" required></div>
    <div class="campo"><label for="estoque">Estoque (un.)</label><input id="estoque" type="number" step="1" min="0" required></div>
   </div>
   <div class="linha">
    <div class="campo"><label for="fab">Fabricação</label><input id="fab" type="date" required></div>
    <div class="campo"><label for="val">Validade</label><input id="val" type="date" required></div>
   </div>
   <div class="campo"><label for="emoji">Etiqueta curta (aparece no card)</label><input id="emoji" maxlength="24" placeholder="Ex.: Pão"></div>
   <div class="acoes">
    <button class="btn" type="submit" id="btnSalvar">Cadastrar produto</button>
    <button class="btn sec" type="button" id="btnCancelar" hidden>Cancelar edição</button>
   </div>
   <p class="msg" id="msgProduto" role="status"></p>
  </form>
 </section>

 <section class="painel">
  <h2>Meus produtos</h2>
  <div id="listaProdutos"></div>
 </section>
</main>
<script src="session.js"></script>
<script src="parceiro.js"></script>
</body>
</html>
